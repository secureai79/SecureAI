# SecureAI - API + PostgreSQL.
#
# All settings live in ONE file: .env (copy .env.example, or run `python scripts/init_env.py`).
# Compose passes the whole file to the app via `env_file`; only values that must be derived
# or must never be overridden are set under `environment:` (those win over .env).
services:
  app:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Built from the POSTGRES_* values unless .env provides its own DATABASE_URL.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-aisafety}:${POSTGRES_PASSWORD}@db:5432/ai_safety_checkup}
      # Where the GitHub App private key is mounted inside the container (see volumes).
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key.pem
      # Safety rails that .env cannot loosen when running in this container.
      # Clones and analysis output go to a disk volume, not RAM-backed /tmp, so big repositories fit.
      SCAN_WORKDIR: /work
      ALLOW_LOCAL_REPOS: "false"
      SCAN_DEBUG_LOG: "false"
      # Fail fast with a clear message if the origin list is missing.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env to the exact frontend origin(s)}
    depends_on:
      db:
        condition: service_healthy
    # Container hardening: no root, no extra privileges, read-only root filesystem.
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 3g          # large repositories need headroom; lower it on small hosts together with SCAN_WORKER_MEMORY_MB
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    volumes:
      - scan_work:/work
      # Host path of the GitHub App PEM: set GITHUB_APP_PRIVATE_KEY_PATH in .env
      # (e.g. C:/Users/you/ai-safety-secrets/key.pem). Compose refuses to start if it does not exist.
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_PATH:-./secrets/github_app_private_key.pem}
        target: /run/secrets/github_app_private_key.pem
        read_only: true
        bind:
          create_host_path: false

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    # Not published to the host: only the app container can reach the database.
    environment:
      POSTGRES_DB: ai_safety_checkup
      POSTGRES_USER: ${POSTGRES_USER:-aisafety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong database password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  scan_work:
